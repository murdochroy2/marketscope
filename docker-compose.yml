services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketscope
      POSTGRES_PASSWORD: marketscope
      POSTGRES_DB: marketscope
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketscope -d marketscope"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://marketscope:marketscope@db:5432/marketscope
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

  # Not started by `docker compose up`. Run with: docker compose run --rm --build tests
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test

volumes:
  pgdata:
